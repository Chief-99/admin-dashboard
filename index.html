<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <title>Admin Dashboard</title>
</head>

<body>

    <header class="header">
        <div class="search-and-profile-wrapper">
            <div class="search-section">
                <i class="material-icons search-icon">search</i>
                <input type="search" name="search" id="searchbar">
            </div>
            <div class="profile-section">
                <i class="material-icons notifications-icon">notifications_active</i>
                <img src="images/morgan-oakley-avatar.png" alt="An avatar of aman with a beanie" class="profile-image" height="40em">
                <p class="profile-name">Morgan Oakley</p>
            </div>
        </div>
        <div class="user-info-button-wrapper">
            <div class="user-info">
                <img src="images/morgan-oakley-avatar.png" alt="An avatar of a man with a beanie on his head." class="user-image" height="70em">
                <p class="greeting">Hi there,</p>
                <p class="user-name">Morgan Oakley (@morgan)</p>
            </div>
            <div class="header-buttons">
                <button class="new-button">New</button>
                <button class="upload-button">Upload</button>
                <button class="share-button">Share</button>
            </div>
        </div>
    </header>

</body>

</html>
